[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperchain"
version = "0.1.0"
description = "WhisperChain+: anonymous messaging with role-based control and accountability"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "cryptography",
    "PyJWT",
    "argon2-cffi",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["whisperchain*"]

[tool.setuptools.package-data]
"whisperchain.server" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette warns that its TestClient will move off httpx; httpx is our
# allowed dependency, so hide that one warning.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
